[project]
name = "mytransformer"
version = "0.1.0"
description = "从零实现并训练一个 500M decoder-only Transformer LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# 分词器训练与数据处理
data = [
    "tokenizers>=0.21",
    "datasets>=3.0",
    "fasttext-wheel>=0.9.2",
]
# 训练时的日志
train = [
    "wandb>=0.18",
]
# 数值对齐测试需要 HF 实现作为参照
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "transformers>=4.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mytransformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
